<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>Subway Dash 3D — Endless Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tilt+Neon&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#ffd23f;
    --accent2:#ff5e62;
    --panel:rgba(10,14,30,.72);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:'Rubik',system-ui,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;}
  #gamecanvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .hidden{display:none !important;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
  .hud-top{display:flex;justify-content:space-between;align-items:flex-start;padding:max(12px, env(safe-area-inset-top)) 16px 0;}
  .score-box{background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 14px;color:#fff;min-width:110px;}
  .score-box .lbl{font-size:10px;letter-spacing:2px;opacity:.7;text-transform:uppercase;}
  .score-box .val{font-family:'Tilt Neon',cursive;font-size:24px;line-height:1.1;color:var(--accent);}
  .coin-box{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 14px;color:#fff;}
  .coin-dot{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffd23f 45%,#c98f00);box-shadow:0 0 8px rgba(255,210,63,.6);}
  .coin-box .val{font-family:'Tilt Neon',cursive;font-size:20px;}
  .hud-btns{display:flex;gap:8px;pointer-events:auto;}
  .icon-btn{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-btn:active{transform:scale(.92);}
  #comboBar{position:fixed;left:50%;top:84px;transform:translateX(-50%);font-family:'Tilt Neon',cursive;font-size:20px;color:#7cf6ff;text-shadow:0 0 12px rgba(124,246,255,.8);opacity:0;transition:opacity .2s;}

  /* ---------- Screens ---------- */
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(6,8,20,.55),rgba(6,8,20,.82));backdrop-filter:blur(6px);padding:24px;text-align:center;color:#fff;}
  .title-logo{font-family:'Tilt Neon',cursive;font-size:clamp(44px,11vw,84px);line-height:1;background:linear-gradient(100deg,#ffd23f,#ff5e62 55%,#7cf6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,94,98,.35));}
  .subtitle{margin-top:6px;font-size:14px;letter-spacing:4px;text-transform:uppercase;opacity:.75;}
  .best-chip{margin-top:18px;background:var(--panel);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 18px;font-size:14px;}
  .best-chip b{color:var(--accent);font-family:'Tilt Neon',cursive;font-size:18px;margin-left:6px;}
  .big-btn{pointer-events:auto;margin-top:30px;border:none;cursor:pointer;font-family:'Tilt Neon',cursive;font-size:26px;letter-spacing:1px;color:#1b1200;padding:16px 54px;border-radius:999px;background:linear-gradient(135deg,#ffd23f,#ff9d2f);box-shadow:0 10px 30px rgba(255,157,47,.45),inset 0 2px 0 rgba(255,255,255,.6);transition:transform .12s;}
  .big-btn:active{transform:scale(.95);}
  .hint{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:520px;}
  .hint .k{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 12px;font-size:12.5px;opacity:.9;}
  .hint .k b{color:var(--accent);}
  #menuHintAnim{margin-top:22px;font-size:13px;opacity:.65;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}

  .over-title{font-family:'Tilt Neon',cursive;font-size:clamp(36px,9vw,60px);color:var(--accent2);text-shadow:0 0 30px rgba(255,94,98,.5);}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;width:min(92vw,420px);}
  .stat{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 6px;}
  .stat .l{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.65;}
  .stat .v{font-family:'Tilt Neon',cursive;font-size:24px;color:#fff;margin-top:2px;}
  .stat .v.gold{color:var(--accent);}
  #newBest{margin-top:14px;font-family:'Tilt Neon',cursive;font-size:20px;color:#7cf6ff;text-shadow:0 0 16px rgba(124,246,255,.7);animation:pulse 1s infinite;}
  .btn-row{display:flex;gap:14px;margin-top:26px;}
  .ghost-btn{pointer-events:auto;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font-family:'Rubik';font-weight:600;font-size:16px;padding:13px 26px;border-radius:999px;cursor:pointer;}
  .ghost-btn:active{transform:scale(.95);}

  /* pause */
  #pauseScreen{background:rgba(6,8,20,.6);}
  /* loading */
  #loading{z-index:20;background:#0b1020;}
  .loader{width:54px;height:54px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading p{margin-top:16px;letter-spacing:3px;font-size:12px;opacity:.6;text-transform:uppercase;}

  /* swipe debug flash + powerup badges */
  #powerups{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;z-index:4;pointer-events:none;}
  .pu{background:var(--panel);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 12px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .pu .t{color:var(--accent);font-family:'Tilt Neon',cursive;}
</style>
</head>
<body>
  <canvas id="gamecanvas"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="score-box"><div class="lbl">Score</div><div class="val" id="scoreVal">0</div></div>
      <div class="hud-btns">
        <button class="icon-btn" id="soundBtn">🔊</button>
        <button class="icon-btn" id="pauseBtn">⏸</button>
      </div>
    </div>
    <div class="hud-top" style="margin-top:10px;">
      <div style="width:0"></div>
      <div class="coin-box"><div class="coin-dot"></div><div class="val" id="coinVal">0</div></div>
    </div>
    <div id="comboBar"></div>
  </div>
  <div id="powerups"></div>

  <!-- Loading -->
  <div id="loading" class="screen">
    <div class="loader"></div>
    <p>Loading world</p>
  </div>

  <!-- Menu -->
  <div id="menuScreen" class="screen hidden">
    <div class="title-logo">SUBWAY<br>DASH 3D</div>
    <div class="subtitle">Endless Subway Runner</div>
    <div class="best-chip">BEST<b id="menuBest">0</b></div>
    <button class="big-btn" id="playBtn">PLAY</button>
    <div class="hint">
      <div class="k"><b>Swipe ◀ ▶</b> Change lane</div>
      <div class="k"><b>Swipe ▲</b> Jump</div>
      <div class="k"><b>Swipe ▼</b> Roll / Slide</div>
      <div class="k"><b>Hold ▲</b> Hoverboard</div>
    </div>
    <div id="menuHintAnim">Tip: grab magnet coins & ride through trains on your hoverboard!</div>
  </div>

  <!-- Pause -->
  <div id="pauseScreen" class="screen hidden">
    <div class="title-logo" style="font-size:44px;">PAUSED</div>
    <button class="big-btn" id="resumeBtn">RESUME</button>
    <div class="btn-row"><button class="ghost-btn" id="quitBtn">Quit to menu</button></div>
  </div>

  <!-- Game over -->
  <div id="overScreen" class="screen hidden">
    <div class="over-title">GAME OVER</div>
    <div id="newBest" class="hidden">★ NEW BEST! ★</div>
    <div class="stat-grid">
      <div class="stat"><div class="l">Score</div><div class="v" id="overScore">0</div></div>
      <div class="stat"><div class="l">Coins</div><div class="v gold" id="overCoins">0</div></div>
      <div class="stat"><div class="l">Best</div><div class="v" id="overBest">0</div></div>
    </div>
    <div class="btn-row">
      <button class="big-btn" id="retryBtn" style="font-size:20px;padding:14px 36px;">RETRY</button>
      <button class="ghost-btn" id="homeBtn">Menu</button>
    </div>
  </div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
